[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polydiff"
version = "0.1.0"
description = "One git config. Every file type gets a real diff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PolyDiff Contributors" },
]
keywords = ["git", "diff", "binary", "images", "pdf", "xlsx", "excel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
polydiff = "polydiff.cli:app"

[project.entry-points."polydiff/plugins"]
image = "polydiff.plugins.image_diff:ImageDiffPlugin"
pdf = "polydiff.plugins.pdf_diff:PdfDiffPlugin"
xlsx = "polydiff.plugins.xlsx_diff:XlsxDiffPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/polydiff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
